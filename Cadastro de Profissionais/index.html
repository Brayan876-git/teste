
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Profissional - Gerente</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

</head>
<body>

    <main class="pagina">
        <header class="menu">
            <nav>
                <a href="#" class="ativo">INÍCIO</a>
                <a href="#">ORDENS</a>
                <a href="#">SERVIÇOS</a>
                <a href="#">CONVERSAS</a>
            </nav>

            <div class="perfil">●</div>
        </header>

        <section class="formulario">
            <h2>CADASTRO PROFISSIONAIS</h2>

            <form>
                <div class="campo-duplo">
                    <div class="campo">
                        <label for="nome">Nome <span>*</span></label>
                        <input type="text" id="nome" placeholder="Nome" required>
                    </div>

                    <div class="campo">
                        <label for="sobrenome">Sobrenome <span>*</span></label>
                        <input type="text" id="sobrenome"
                               placeholder="Sobrenome" required>
                    </div>
                </div>

                <div class="campo">
                    <label for="cpf">CPF <span>*</span></label>
                    <input type="text" id="cpf" placeholder="000.000.000-00"
                           maxlength="14" required>
                </div>

                <div class="campo">
                    <label for="nascimento">Data de nascimento</label>
                    <input type="date" id="nascimento">
                </div>

                <div class="campo">
                    <label for="telefone">Telefone ou celular <span>*</span></label>
                    <input type="tel" id="telefone"
                           placeholder="(00) 00000-0000" required>
                </div>

                <div class="campo">
                    <label for="email">E-mail <span>*</span></label>
                    <input type="email" id="email" placeholder="E-mail" required>
                </div>

                <h3>Informações do endereço</h3>

                <div class="campo-duplo">
                    <div class="campo">
                        <label for="cep">CEP</label>
                        <input type="text" id="cep" placeholder="00000-000">
                    </div>

                    <div class="campo">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" placeholder="Cidade">
                    </div>
                </div>

                <div class="campo-duplo">
                    <div class="campo">
                        <label for="estado">Estado</label>
                        <select id="estado">
                            <option value="">Selecione</option>
                            <option>SP</option>
                            <option>RJ</option>
                            <option>MG</option>
                            <option>PR</option>
                            <option>BA</option>
                            <option>RS</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="endereco">Endereço <span>*</span></label>
                        <input type="text" id="endereco"
                               placeholder="Rua, bairro, número" required>
                    </div>
                </div>

                <div class="campo">
                    <label for="etnia">Etnia</label>
                    <input type="text" id="etnia">
                </div>

                <div class="campo-duplo">
                    <div class="campo">
                        <label for="admissao">Data de admissão <span>*</span></label>
                        <input type="date" id="admissao" required>
                    </div>

                    <div class="campo">
                        <label for="cargo">Cargo <span>*</span></label>
                        <input type="text" id="cargo" required>
                    </div>
                </div>

                <div class="campo">
                    <label for="salario">Salário</label>
                    <input type="number" id="salario" step="0.01">
                </div>

                <button type="submit">Cadastrar-se</button>
            </form>
        </section>
    </main>

</body>
</html>
