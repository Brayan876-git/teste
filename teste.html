<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <title>Testes</title>
</head>
<body>
    <header class="topbar">
  <nav class="topbar__links">
    <a class="active" href="#">INÍCIO</a>
    <a href="#">ORDENS</a>
    <a href="#">CONVERSAS</a>
  </nav>
  <button class="topbar__avatar" aria-label="Perfil">
    <!-- seu ícone de perfil -->
  </button>
</header>

<main class="page">
  <form class="card">
    <h1>Complete seu cadastro</h1>

    <div class="row">
      <label>Nome <span class="req">*</span>
        <input placeholder="Nome">
      </label>
      <label>Sobrenome <span class="req">*</span>
        <input placeholder="Sobrenome">
      </label>
    </div>

    <label>CPF <span class="req">*</span>
      <input placeholder="000.000.000-00">
    </label>

    <label>Data aniversário <span class="req">*</span>
      <input placeholder="dd/mm/aaaa">
    </label>

    <label>Telefone ou celular <span class="req">*</span>
      <input placeholder="(DDD) Telefone">
    </label>

    <label>E-mail
      <input placeholder="Email">
    </label>

    <h2>Dados para envio</h2>

    <div class="row">
      <label>CEP <input placeholder="00000-000"></label>
      <label>Cidade <input placeholder="Cidade"></label>
    </div>

    <div class="row">
      <label>Estado
        <select><option>None</option>
          <option>SP</option>
          <option>BH</option>
        </select>
      </label>
      <label>Endereço
        <input placeholder="Rua, Bairro., Número">
      </label>
    </div>
  </form>

  <button class="btn-submit" type="submit">Cadastrar-se</button>
</main>
